name: Foundation production Lambda inspect

# READ ONLY. Downloads current darmelk-prod-api package and classifies it.
# Never updates Lambda code. Never runs migrate. Never creates foundation accounts.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  DEPLOY_ROLE_ARN: arn:aws:iam::364410974458:role/darmelk-prod-github-deploy
  FUNCTION_NAME: darmelk-prod-api
  KNOWN_RESTORED_CODESHA256: CeyPy3s9WkLtLsZyWe9AezvBGM7VLemDfSMSx2eqNvU=
  LAST_OFFICIAL_DEPLOY_SHA: 19086f8d54ae3f3b60109331508531481324f878
  FOUNDATION_SHA: b1d4fb1288c96d08c9cdce945eb4e01f03f23dd4

jobs:
  inspect:
    name: Inspect Lambda package (no writes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inspect current Lambda package without updating code
        run: |
          set -euo pipefail
          mkdir -p artifacts pkg
          aws lambda get-function-configuration --function-name "$FUNCTION_NAME" \
            --query '{FunctionName:FunctionName,FunctionArn:FunctionArn,Runtime:Runtime,Role:Role,Handler:Handler,CodeSize:CodeSize,Timeout:Timeout,MemorySize:MemorySize,LastModified:LastModified,CodeSha256:CodeSha256,Version:Version,LastUpdateStatus:LastUpdateStatus,State:State,RevisionId:RevisionId,Architectures:Architectures,VpcConfig:{SubnetIds:VpcConfig.SubnetIds,SecurityGroupIds:VpcConfig.SecurityGroupIds,VpcId:VpcConfig.VpcId}}' \
            > artifacts/lambda-config.json
          cat artifacts/lambda-config.json
          URL=$(aws lambda get-function --function-name "$FUNCTION_NAME" --query 'Code.Location' --output text)
          curl -fsSL "$URL" -o artifacts/current.zip
          python3 - << 'PY'
          import hashlib, json, os, re, zipfile, subprocess, pathlib
          root = pathlib.Path("artifacts")
          cfg = json.loads((root / "lambda-config.json").read_text())
          zpath = root / "current.zip"
          data = zpath.read_bytes()
          sha = hashlib.sha256(data).hexdigest()
          names = []
          hits = []
          patterns = [
              "foundation-maintenance",
              "foundation-dry-run",
              "createFoundationNetwork",
              "confirm-production",
              "force-rebuild",
              "FOUNDATION_RESET",
              "foundation.darmelk.invalid",
              "HW@2026",
              "darmelk-foundation",
              "hashPassword",
          ]
          with zipfile.ZipFile(zpath) as z:
              names = z.namelist()
              z.extractall("pkg")
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  raw = z.read(info.filename)
                  try:
                      text = raw.decode("utf-8", errors="ignore")
                  except Exception:
                      continue
                  found = [p for p in patterns if p in text]
                  if found:
                      hits.append({"file": info.filename, "patterns": found, "size": info.file_size})
          classification = "ORIGINAL"
          reasons = []
          if hits:
              classification = "TEMPORARY_ADAPTER"
              reasons.append("bundle contains foundation/maintenance marker strings")
          expected_handler = cfg.get("Handler") == "index.handler"
          if not expected_handler:
              classification = "UNKNOWN"
              reasons.append(f"unexpected handler {cfg.get('Handler')}")
          if cfg.get("FunctionName") != "darmelk-prod-api":
              classification = "UNKNOWN"
              reasons.append("unexpected function name")
          known = os.environ["KNOWN_RESTORED_CODESHA256"]
          matches_known = cfg.get("CodeSha256") == known
          report = {
              "functionName": cfg.get("FunctionName"),
              "handler": cfg.get("Handler"),
              "runtime": cfg.get("Runtime"),
              "codeSize": cfg.get("CodeSize"),
              "timeout": cfg.get("Timeout"),
              "memorySize": cfg.get("MemorySize"),
              "lastModified": cfg.get("LastModified"),
              "codeSha256": cfg.get("CodeSha256"),
              "matchesKnownRestoredCodeSha256": matches_known,
              "knownRestoredCodeSha256": known,
              "lastUpdateStatus": cfg.get("LastUpdateStatus"),
              "state": cfg.get("State"),
              "revisionId": cfg.get("RevisionId"),
              "architectures": cfg.get("Architectures"),
              "vpcId": (cfg.get("VpcConfig") or {}).get("VpcId"),
              "subnetIds": (cfg.get("VpcConfig") or {}).get("SubnetIds"),
              "securityGroupIds": (cfg.get("VpcConfig") or {}).get("SecurityGroupIds"),
              "zipSha256": sha,
              "zipEntries": names,
              "markerHits": hits,
              "classification": classification,
              "reasons": reasons,
              "lambdaCodeUpdated": False,
              "databaseWritesPerformed": False,
          }
          (root / "lambda-inspect.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          PY

      - name: Invoke existing health and describe only
        run: |
          set -euo pipefail
          aws lambda invoke --function-name "$FUNCTION_NAME" --cli-binary-format raw-in-base64-out \
            --payload '{"action":"health"}' artifacts/health.json >/tmp/health-meta.json
          echo "----- health meta -----"
          cat /tmp/health-meta.json
          echo "----- health body -----"
          cat artifacts/health.json
          echo
          aws lambda invoke --function-name "$FUNCTION_NAME" --cli-binary-format raw-in-base64-out \
            --payload '{"action":"describe"}' artifacts/describe.json >/tmp/describe-meta.json
          echo "----- describe meta -----"
          cat /tmp/describe-meta.json
          echo "----- describe body -----"
          cat artifacts/describe.json
          echo
          aws lambda invoke --function-name "$FUNCTION_NAME" --cli-binary-format raw-in-base64-out \
            --payload '{"action":"foundation-dry-run"}' artifacts/unknown-action-dry-run.json >/tmp/unknown-meta.json || true
          echo "----- unknown-action meta -----"
          cat /tmp/unknown-meta.json || true
          echo "----- unknown-action body -----"
          cat artifacts/unknown-action-dry-run.json || true
          echo
          python3 - << 'PY'
          import json, pathlib, urllib.request
          root = pathlib.Path("artifacts")
          report = json.loads((root / "lambda-inspect.json").read_text())
          def load(p):
              try:
                  return json.loads(pathlib.Path(p).read_text())
              except Exception as e:
                  return {"_parse_error": str(e), "raw": pathlib.Path(p).read_text(errors="replace")[:2000]}
          report["health"] = load("artifacts/health.json")
          report["describe"] = load("artifacts/describe.json")
          unknown = load("artifacts/unknown-action-dry-run.json")
          report["foundationDryRunActionResponse"] = unknown
          # Public health via BETTER_AUTH_URL from secrets, without printing the secret itself.
          import os, subprocess
          cfg = subprocess.check_output([
              "aws", "secretsmanager", "get-secret-value",
              "--secret-id", "darmelk-prod/app",
              "--query", "SecretString",
              "--output", "text",
          ], text=True)
          import json as js
          secret = js.loads(cfg)
          url = secret.get("BETTER_AUTH_URL", "").rstrip("/") + "/api/health"
          try:
              with urllib.request.urlopen(url, timeout=20) as r:
                  body = r.read().decode()
                  report["publicApiHealth"] = {"status": r.status, "body": js.loads(body) if body.startswith("{") else body[:500]}
          except Exception as e:
              report["publicApiHealth"] = {"error": str(e)}
          (root / "lambda-inspect.json").write_text(js.dumps(report, indent=2) + "\n")
          print(js.dumps({
              "classification": report.get("classification"),
              "lastModified": report.get("lastModified"),
              "codeSha256": report.get("codeSha256"),
              "matchesKnownRestoredCodeSha256": report.get("matchesKnownRestoredCodeSha256"),
              "markerHits": report.get("markerHits"),
              "health": report.get("health"),
              "foundationDryRunActionResponse": report.get("foundationDryRunActionResponse"),
              "describeOk": isinstance(report.get("describe"), dict) and report.get("describe", {}).get("ok") is True,
              "describeDatabase": report.get("describe", {}).get("database") if isinstance(report.get("describe"), dict) else None,
              "describeTableCount": len(report.get("describe", {}).get("tables") or []) if isinstance(report.get("describe"), dict) else None,
              "publicApiHealth": report.get("publicApiHealth"),
              "lambdaCodeUpdated": False,
              "databaseWritesPerformed": False,
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-lambda-inspect
          path: artifacts/lambda-inspect.json
