name: Foundation production setup

# Isolated Darmelk in-VPC path. Inspect is read-only. Execute is atomic and
# refused unless live preconditions pass. Original Lambda zip is always restored.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  DEPLOY_ROLE_ARN: arn:aws:iam::364410974458:role/darmelk-prod-github-deploy
  FUNCTION_NAME: darmelk-prod-api
  KNOWN_ORIGINAL_CODESHA256: CeyPy3s9WkLtLsZyWe9AezvBGM7VLemDfSMSx2eqNvU=
  FOUNDATION_SHA: b1d4fb1288c96d08c9cdce945eb4e01f03f23dd4

jobs:
  setup:
    name: Inspect then maybe execute (always restore Lambda)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout foundation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FOUNDATION_SHA }}

      - name: Checkout maintenance helpers from this workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: wf-src
          sparse-checkout: |
            .github/foundation-maintenance.ts
            .github/patch-foundation-maintenance-handler.py
          sparse-checkout-cone-mode: false

      - name: Place helpers
        run: |
          cp wf-src/.github/foundation-maintenance.ts backend/src/foundation-maintenance.ts
          cp wf-src/.github/patch-foundation-maintenance-handler.py backend/patch-foundation-maintenance-handler.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Snapshot original production Lambda
        run: |
          set -euo pipefail
          mkdir -p artifacts
          aws lambda get-function-configuration --function-name "$FUNCTION_NAME" \
            --query '{FunctionName:FunctionName,Handler:Handler,Runtime:Runtime,CodeSize:CodeSize,Timeout:Timeout,MemorySize:MemorySize,LastModified:LastModified,CodeSha256:CodeSha256,LastUpdateStatus:LastUpdateStatus,State:State,RevisionId:RevisionId,Architectures:Architectures}' \
            > artifacts/lambda-before.json
          cat artifacts/lambda-before.json
          SHA=$(jq -r .CodeSha256 artifacts/lambda-before.json)
          echo "$SHA" > /tmp/original-codesha256.txt
          if [ "$SHA" != "$KNOWN_ORIGINAL_CODESHA256" ]; then
            echo "Refusing to continue: Lambda CodeSha256 $SHA is not the known original $KNOWN_ORIGINAL_CODESHA256"
            exit 1
          fi
          URL=$(aws lambda get-function --function-name "$FUNCTION_NAME" --query 'Code.Location' --output text)
          curl -fsSL "$URL" -o /tmp/original.zip
          echo "snapshotted original production zip"

      - name: Deploy temporary maintenance adapter
        working-directory: backend
        run: |
          set -euo pipefail
          python3 patch-foundation-maintenance-handler.py
          npm run build
          cd dist
          zip -qr ../lambda.zip . -x "smoke-test.mjs"
          cd ..
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://lambda.zip >/dev/null
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          echo "temporary adapter deployed"

      - name: Live read-only inspect
        run: |
          set -euo pipefail
          aws lambda invoke --function-name "$FUNCTION_NAME" --cli-binary-format raw-in-base64-out \
            --payload '{"action":"foundation-inspect","mode":"inspect"}' \
            artifacts/pre-inspect.json > artifacts/pre-inspect-meta.json
          cat artifacts/pre-inspect-meta.json
          cat artifacts/pre-inspect.json
          echo
          jq -e '.[0].StatusCode == 200 and ((.[0].FunctionError // "") | length) == 0' artifacts/pre-inspect-meta.json >/dev/null || \
            jq -e '.StatusCode == 200 and ((.FunctionError // "") | length) == 0' artifacts/pre-inspect-meta.json
          jq -e '.ok == true and .productionWritesPerformed == false' artifacts/pre-inspect.json
          STATE=$(jq -r .dbState artifacts/pre-inspect.json)
          SAFE=$(jq -r .safeToExecute artifacts/pre-inspect.json)
          echo "STATE=$STATE" >> "$GITHUB_ENV"
          echo "SAFE=$SAFE" >> "$GITHUB_ENV"
          echo "PRE_DB_STATE=$STATE"

      - name: Execute foundation if required and safe
        if: env.STATE == 'NOT_EXECUTED' && env.SAFE == 'true'
        run: |
          set -euo pipefail
          printf '%s' '{"action":"foundation-execute","mode":"execute","confirmReset":true,"confirmProduction":true,"forceRebuild":false}' > /tmp/execute-payload.json
          aws lambda invoke --function-name "$FUNCTION_NAME" --cli-binary-format raw-in-base64-out \
            --payload fileb:///tmp/execute-payload.json \
            artifacts/execute.json > artifacts/execute-meta.json
          cat artifacts/execute-meta.json
          cat artifacts/execute.json
          echo
          jq -e '.[0].StatusCode == 200 and ((.[0].FunctionError // "") | length) == 0' artifacts/execute-meta.json >/dev/null || \
            jq -e '.StatusCode == 200 and ((.FunctionError // "") | length) == 0' artifacts/execute-meta.json
          jq -e '.ok == true and .passwordLogged == false and .aborted != true' artifacts/execute.json

      - name: Independent post inspect while adapter is present
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f artifacts/pre-inspect.json ]; then
            echo "pre-inspect missing; skipping post inspect"
            exit 0
          fi
          aws lambda invoke --function-name "$FUNCTION_NAME" --cli-binary-format raw-in-base64-out \
            --payload '{"action":"foundation-inspect","mode":"inspect"}' \
            artifacts/post-inspect.json > artifacts/post-inspect-meta.json
          cat artifacts/post-inspect-meta.json
          cat artifacts/post-inspect.json
          echo

      - name: Restore original production Lambda
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f /tmp/original.zip ]; then
            echo "No original zip captured; nothing to restore."
            exit 1
          fi
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb:///tmp/original.zip >/dev/null
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          CUR=$(aws lambda get-function-configuration --function-name "$FUNCTION_NAME" --query 'CodeSha256' --output text)
          ORIG=$(cat /tmp/original-codesha256.txt)
          echo "restored CodeSha256=$CUR expected=$ORIG"
          if [ "$CUR" != "$ORIG" ] || [ "$CUR" != "$KNOWN_ORIGINAL_CODESHA256" ]; then
            echo "RESTORE HASH MISMATCH"
            exit 1
          fi
          echo "Restored original production Lambda code"

      - name: Verify original handler after restore
        if: always()
        run: |
          set -euo pipefail
          aws lambda invoke --function-name "$FUNCTION_NAME" --cli-binary-format raw-in-base64-out \
            --payload '{"action":"health"}' artifacts/health.json > artifacts/health-meta.json
          cat artifacts/health.json
          jq -e '.ok == true' artifacts/health.json
          aws lambda invoke --function-name "$FUNCTION_NAME" --cli-binary-format raw-in-base64-out \
            --payload '{"action":"foundation-inspect"}' artifacts/unknown-inspect.json > artifacts/unknown-inspect-meta.json || true
          cat artifacts/unknown-inspect.json
          jq -e '.ok == false and (.error | test("unknown action"))' artifacts/unknown-inspect.json
          aws lambda invoke --function-name "$FUNCTION_NAME" --cli-binary-format raw-in-base64-out \
            --payload '{"action":"foundation-execute"}' artifacts/unknown-execute.json > artifacts/unknown-execute-meta.json || true
          cat artifacts/unknown-execute.json
          jq -e '.ok == false and (.error | test("unknown action"))' artifacts/unknown-execute.json
          CONFIG=$(aws secretsmanager get-secret-value --secret-id darmelk-prod/app --query SecretString --output text)
          URL=$(echo "$CONFIG" | jq -r .BETTER_AUTH_URL)
          echo "::add-mask::$URL"
          curl -sf "$URL/api/health" | tee artifacts/public-health.json
          jq -e '.ok == true' artifacts/public-health.json

      - name: Sample foundation logins against restored API
        if: always()
        env:
          FOUNDATION_SAMPLE_PASSWORD: HW@2026#Common
        run: |
          set -euo pipefail
          echo "::add-mask::$FOUNDATION_SAMPLE_PASSWORD"
          if [ ! -f artifacts/post-inspect.json ]; then
            echo '{"skipped":true}' > artifacts/sample-logins.json
            exit 0
          fi
          STATE=$(jq -r '.dbState // empty' artifacts/post-inspect.json)
          if [ "$STATE" != "EXECUTED_SUCCESSFULLY" ]; then
            echo '{"skipped":true,"reason":"foundation not fully present"}' > artifacts/sample-logins.json
            cat artifacts/sample-logins.json
            exit 0
          fi
          CONFIG=$(aws secretsmanager get-secret-value --secret-id darmelk-prod/app --query SecretString --output text)
          URL=$(echo "$CONFIG" | jq -r .BETTER_AUTH_URL)
          echo "::add-mask::$URL"
          python3 - << 'PY'
          import json, os, urllib.error, urllib.request
          password = os.environ["FOUNDATION_SAMPLE_PASSWORD"]
          base = os.environ.get("BETTER_AUTH_URL")
          if not base:
              import subprocess
              cfg = subprocess.check_output([
                  "aws","secretsmanager","get-secret-value",
                  "--secret-id","darmelk-prod/app",
                  "--query","SecretString","--output","text"
              ], text=True)
              base = json.loads(cfg)["BETTER_AUTH_URL"]
          base = base.rstrip("/")
          samples = {
              "root": "hw-root@foundation.darmelk.invalid",
              "l1": "hw-1@foundation.darmelk.invalid",
              "l2": "hw-1-1@foundation.darmelk.invalid",
              "l3": "hw-1-1-1@foundation.darmelk.invalid",
              "l4": "hw-1-1-1-1@foundation.darmelk.invalid",
          }
          out = {}
          for key, email in samples.items():
              req = urllib.request.Request(
                  base + "/api/auth/sign-in/email",
                  data=json.dumps({"email": email, "password": password}).encode(),
                  headers={
                      "content-type": "application/json",
                      "origin": "https://darmelk.com",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as r:
                      body = r.read().decode(errors="replace")
                      parsed = json.loads(body) if body.startswith("{") else {"raw": body[:300]}
                      user = parsed.get("user") if isinstance(parsed, dict) else None
                      out[key] = {
                          "status": r.status,
                          "ok": r.status == 200,
                          "email": email,
                          "userName": (user or {}).get("name") if isinstance(user, dict) else None,
                      }
              except urllib.error.HTTPError as e:
                  body = e.read().decode(errors="replace")[:500]
                  out[key] = {"status": e.code, "ok": False, "email": email, "error": body}
              except Exception as e:
                  out[key] = {"status": 0, "ok": False, "email": email, "error": str(e)}
          pathlib = __import__("pathlib")
          pathlib.Path("artifacts/sample-logins.json").write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps(out, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-prod-setup
          path: artifacts
