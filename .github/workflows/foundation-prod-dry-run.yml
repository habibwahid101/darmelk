name: Foundation production dry-run

# Read-only production inspect of the 121-ID foundation initializer.
# Never pass --confirm-reset / --confirm-production / --force-rebuild.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  DEPLOY_ROLE_ARN: arn:aws:iam::364410974458:role/darmelk-prod-github-deploy
  FUNCTION_NAME: darmelk-prod-api
  FOUNDATION_SHA: b1d4fb1288c96d08c9cdce945eb4e01f03f23dd4

jobs:
  dry-run:
    name: Production dry-run (no writes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout foundation SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FOUNDATION_SHA }}

      - name: Checkout dry-run helper from this workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: wf-src
          sparse-checkout: .github/foundation-dry-run-lambda.ts
          sparse-checkout-cone-mode: false

      - name: Place helper inside backend src
        run: cp wf-src/.github/foundation-dry-run-lambda.ts backend/src/foundation-dry-run-lambda.ts

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load DATABASE_URL and run official CLI dry-run
        id: cli
        run: |
          set -euo pipefail
          mkdir -p artifacts
          CONFIG=$(aws secretsmanager get-secret-value --secret-id darmelk-prod/app --query SecretString --output text)
          export DATABASE_URL=$(echo "$CONFIG" | jq -r .DATABASE_URL)
          echo "::add-mask::${DATABASE_URL}"

          set +e
          timeout 40s npm run darmelk -- --dry-run > artifacts/cli.json 2> artifacts/cli.err
          CLI_RC=$?
          set -e
          echo "cli_rc=${CLI_RC}" >> "$GITHUB_OUTPUT"
          echo "----- official CLI stdout -----"
          cat artifacts/cli.json || true
          echo "----- official CLI stderr -----"
          cat artifacts/cli.err || true
          if [ "$CLI_RC" -eq 0 ] && jq -e '.dryRun == true' artifacts/cli.json >/dev/null 2>&1; then
            echo "cli_ok=yes" >> "$GITHUB_OUTPUT"
          else
            echo "cli_ok=no" >> "$GITHUB_OUTPUT"
          fi

          set +e
          timeout 40s node --experimental-strip-types -e 'import { handler } from "./backend/src/foundation-dry-run-lambda.ts"; const r = await handler(); console.log(JSON.stringify(r, null, 2));' > artifacts/inspect.json 2> artifacts/inspect.err
          INS_RC=$?
          set -e
          echo "inspect_rc=${INS_RC}" >> "$GITHUB_OUTPUT"
          echo "----- inspect stdout -----"
          cat artifacts/inspect.json || true
          echo "----- inspect stderr -----"
          cat artifacts/inspect.err || true
          if [ "$INS_RC" -eq 0 ] && jq -e '.dryRun == true and .ok == true' artifacts/inspect.json >/dev/null 2>&1; then
            echo "inspect_ok=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "inspect_ok=no" >> "$GITHUB_OUTPUT"

      - name: Snapshot current production Lambda
        if: steps.cli.outputs.inspect_ok != 'yes'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          aws lambda get-function --function-name "$FUNCTION_NAME" --query 'Code.Location' --output text > /tmp/code-url.txt
          curl -fsSL "$(cat /tmp/code-url.txt)" -o /tmp/original.zip
          aws lambda get-function-configuration --function-name "$FUNCTION_NAME" > /tmp/orig-config.json
          cp /tmp/orig-config.json artifacts/orig-config.json
          echo "snapshotted original production zip ($(wc -c < /tmp/original.zip) bytes)"

      - name: Invoke read-only inspect through existing production Lambda
        if: steps.cli.outputs.inspect_ok != 'yes'
        working-directory: backend
        run: |
          set -euo pipefail
          python3 - << 'PY'
          from pathlib import Path
          p = Path("src/handler.ts")
          text = p.read_text()
          if "foundation-dry-run" in text:
              raise SystemExit("handler already patched unexpectedly")
          old_imp = 'import { runMigrations, describeSchema } from "./migrate.js";'
          new_imp = old_imp + '\nimport { handler as foundationDryRun } from "./foundation-dry-run-lambda.ts";'
          if old_imp not in text:
              raise SystemExit("handler.ts import line not found; refusing to patch")
          text = text.replace(old_imp, new_imp, 1)
          needle = 'if (event.action === "describe")'
          inject = '''if (event.action === "foundation-dry-run") {
        return foundationDryRun();
      }
      if (event.action === "describe")'''
          if needle not in text:
              raise SystemExit("handler.ts missing describe action; refusing to patch")
          p.write_text(text.replace(needle, inject, 1))
          PY
          npm run build
          cd dist
          zip -qr ../lambda.zip . -x "smoke-test.mjs"
          cd ..
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://lambda.zip >/dev/null
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          aws lambda invoke --function-name "$FUNCTION_NAME" --cli-binary-format raw-in-base64-out --payload '{"action":"foundation-dry-run"}' ../artifacts/lambda.json
          cat ../artifacts/lambda.json
          jq -e '.dryRun == true and .ok == true and .productionWritesPerformed == false' ../artifacts/lambda.json

      - name: Restore original production Lambda
        if: always() && steps.cli.outputs.inspect_ok != 'yes'
        run: |
          set -euo pipefail
          if [ -f /tmp/original.zip ]; then
            aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb:///tmp/original.zip >/dev/null
            aws lambda wait function-updated --function-name "$FUNCTION_NAME"
            echo "Restored original production Lambda code"
          else
            echo "No original zip captured; nothing to restore."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foundation-dry-run
          path: artifacts
