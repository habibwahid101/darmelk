name: Deploy Darmelk backend

# Test on every push/PR touching the backend or its schema. The deploy job
# only runs on a push event to `main` (see the job-level `if:` below), so
# pushing to any other branch — including the `claude/darmelk-backend-v1`
# review branch — only ever runs the test job. No long-lived AWS credentials
# are used anywhere: the deploy job authenticates via GitHub's OIDC token
# federated to a dedicated Darmelk-only AWS IAM role
# (darmelk-prod-github-deploy — trust policy scoped to
# repo:habibwahid101/darmelk:ref:refs/heads/main; not shared with, and not
# derived from, any Link Mate role).
#
# Every resource referenced below (VPC, subnets, security groups, RDS
# instance, Lambda, Lambda exec role, deploy role, Secrets Manager secret,
# API Gateway) is a dedicated Darmelk resource in its own private VPC —
# nothing here is shared with or reused from Link Mate.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "migrations/**"
      - ".github/workflows/deploy-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "migrations/**"

permissions:
  contents: read
  id-token: write # required for OIDC -> AWS role assumption

env:
  AWS_REGION: ap-south-1
  FUNCTION_NAME: darmelk-prod-api
  DEPLOY_ROLE_ARN: arn:aws:iam::364410974458:role/darmelk-prod-github-deploy
  LAMBDA_EXEC_ROLE_ARN: arn:aws:iam::364410974458:role/darmelk-prod-lambda-exec
  LAMBDA_SUBNET_IDS: subnet-03a8f092b3d87546a,subnet-0e921de3a0d8ef10c
  LAMBDA_SG_ID: sg-049842094a2d14958
  API_GATEWAY_ID: bc968txxph

jobs:
  test:
    name: Build & test backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: darmelk_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/darmelk_ci
      BETTER_AUTH_SECRET: ci-test-secret-not-used-in-production-0123456789ab
      TRUSTED_ORIGINS: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Build Lambda bundle
        working-directory: backend
        run: npm run build
      - name: Apply migrations to the CI database
        working-directory: backend
        run: node -e "import('./dist/index.mjs').then(m=>m.handler({action:'migrate'},{})).then(r=>{console.log(r); if(!r.ok) process.exit(1);})"
      - name: Run backend integration smoke test
        working-directory: backend
        run: |
          node esbuild-smoke.mjs
          node dist/smoke-test.mjs

  deploy:
    name: Deploy to AWS Lambda
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Build Lambda bundle
        working-directory: backend
        run: npm run build
      - name: Package deployment zip
        working-directory: backend
        run: |
          cd dist
          zip -qr ../lambda.zip . -x "smoke-test.mjs"
          cd ..
          ls -la lambda.zip

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load application config from Secrets Manager
        id: config
        run: |
          CONFIG=$(aws secretsmanager get-secret-value --secret-id darmelk-prod/app --query SecretString --output text)
          {
            echo "database_url=$(echo "$CONFIG" | jq -r .DATABASE_URL)"
            echo "better_auth_secret=$(echo "$CONFIG" | jq -r .BETTER_AUTH_SECRET)"
            echo "better_auth_url=$(echo "$CONFIG" | jq -r .BETTER_AUTH_URL)"
            echo "trusted_origins=$(echo "$CONFIG" | jq -r .TRUSTED_ORIGINS)"
            echo "admin_emails=$(echo "$CONFIG" | jq -r .ADMIN_EMAILS)"
            echo "ses_from_email=$(echo "$CONFIG" | jq -r .SES_FROM_EMAIL)"
            echo "cookie_domain=$(echo "$CONFIG" | jq -r '.COOKIE_DOMAIN // empty')"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update Lambda function
        env:
          DATABASE_URL: ${{ steps.config.outputs.database_url }}
          BETTER_AUTH_SECRET: ${{ steps.config.outputs.better_auth_secret }}
          BETTER_AUTH_URL: ${{ steps.config.outputs.better_auth_url }}
          TRUSTED_ORIGINS: ${{ steps.config.outputs.trusted_origins }}
          ADMIN_EMAILS: ${{ steps.config.outputs.admin_emails }}
          SES_FROM_EMAIL: ${{ steps.config.outputs.ses_from_email }}
          COOKIE_DOMAIN: ${{ steps.config.outputs.cookie_domain }}
        run: |
          ENV_JSON=$(jq -n \
            --arg db "$DATABASE_URL" --arg secret "$BETTER_AUTH_SECRET" --arg url "$BETTER_AUTH_URL" \
            --arg origins "$TRUSTED_ORIGINS" --arg admins "$ADMIN_EMAILS" --arg ses "$SES_FROM_EMAIL" \
            --arg cookiedom "$COOKIE_DOMAIN" \
            '{Variables: {DATABASE_URL:$db, BETTER_AUTH_SECRET:$secret, BETTER_AUTH_URL:$url, TRUSTED_ORIGINS:$origins, ADMIN_EMAILS:$admins, SES_FROM_EMAIL:$ses, COOKIE_DOMAIN:$cookiedom}}')

          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            echo "Function exists — updating code, then configuration."
            aws lambda update-function-code --function-name "$FUNCTION_NAME" --zip-file fileb://backend/lambda.zip
            aws lambda wait function-updated --function-name "$FUNCTION_NAME"
            aws lambda update-function-configuration \
              --function-name "$FUNCTION_NAME" \
              --environment "$ENV_JSON" \
              --timeout 15 --memory-size 512
            aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          else
            echo "Function does not exist — creating it."
            IFS=',' read -ra SUBNETS <<< "$LAMBDA_SUBNET_IDS"
            aws lambda create-function \
              --function-name "$FUNCTION_NAME" \
              --runtime nodejs20.x \
              --architectures arm64 \
              --role "$LAMBDA_EXEC_ROLE_ARN" \
              --handler index.handler \
              --zip-file fileb://backend/lambda.zip \
              --timeout 15 --memory-size 512 \
              --vpc-config "SubnetIds=${SUBNETS[0]},${SUBNETS[1]},SecurityGroupIds=$LAMBDA_SG_ID" \
              --environment "$ENV_JSON" \
              --tags Project=Darmelk,Environment=Production
            aws lambda wait function-active --function-name "$FUNCTION_NAME"
          fi

      - name: Allow API Gateway to invoke the function
        run: |
          aws lambda add-permission \
            --function-name "$FUNCTION_NAME" \
            --statement-id apigw-invoke \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:${AWS_REGION}:364410974458:${API_GATEWAY_ID}/*/*/*" \
            2>&1 | grep -qv ResourceConflictException || true

      - name: Run database migrations
        run: |
          aws lambda invoke --function-name "$FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"migrate"}' \
            response.json
          cat response.json
          jq -e '.ok == true' response.json

      - name: Health check
        run: |
          curl -sf "${{ steps.config.outputs.better_auth_url }}/api/health" | tee health.json
          jq -e '.ok == true' health.json
